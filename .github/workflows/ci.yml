name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, crystal: "1.20" }
          - { os: ubuntu-latest, crystal: "1.21" }
          - { os: macos-latest, crystal: "1.21" }
          - { os: windows-latest, crystal: "1.20" }

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{matrix.crystal}}

      - name: Cache shards
        uses: actions/cache@v5
        with:
          path: |
            lib
            bin/ameba*
          key: ${{ matrix.os }}-shards-${{ hashFiles('**/shard.lock') }}

      - name: Install shards
        run: shards check || shards install

      # ---- Build debug release and check code quality on one platform

      - name: Setup debug environment (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: mkdir -p bin/debug

      - name: Build Debug (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: SHARDS_BIN_PATH=bin/debug shards build --debug

      - name: Check formatting (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: crystal tool format; git diff --exit-code src

      - name: Setup ameba (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          mkdir -p bin;
          cp lib/ameba/bin/ameba.cr bin && crystal build -o bin/ameba bin/ameba.cr

      - name: Run static code analysis (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: bin/ameba src/ samples/

      - name: Run tests (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: crystal spec -Dtest

      # ---- Build releases on all platforms

      # Non-Windows
      - name: Setup release environment
        if: ${{ runner.os != 'Windows' }}
        run: mkdir -p bin/release

      - name: Build Release
        if: ${{ runner.os != 'Windows' }}
        run: SHARDS_BIN_PATH=bin/release shards build --release

      - name: Run Sample `csv2xlsx`
        if: ${{ runner.os != 'Windows' }}
        run: bin/release/csv2xlsx 2>&1 | grep "Usage"
